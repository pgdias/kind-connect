name: CD Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Proxmox CT via Tailscale
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Diagnose Tailscale and SSH connectivity
        shell: bash
        run: |
          echo "=== Tailscale status ==="
          tailscale status
          echo "=== Tailscale ping ==="
          tailscale ping --timeout=10s 100.89.42.81 || true
          echo "=== TCP port 22 test ==="
          nc -vz -w 5 100.89.42.81 22

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        timeout-minutes: 12
        with:
          host: ${{ secrets.TAILSCALE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          debug: false
          script: |
            bash /opt/kind-connect/scripts/deploy.sh
