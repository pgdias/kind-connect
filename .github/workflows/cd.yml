name: CD Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Proxmox CT via Tailscale
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Diagnose Tailscale and SSH connectivity
        shell: bash
        run: |
          echo "=== Tailscale status ==="
          tailscale status
          echo "=== Tailscale ping ==="
          tailscale ping --timeout=10s 100.89.42.81 || true
          echo "=== TCP port 22 test ==="
          nc -vz -w 5 100.89.42.81 22

      - name: Pull Docker images directly on deploy host
        shell: bash
        timeout-minutes: 8
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          # Pass the short-lived token through the encrypted SSH input, not as a command-line argument.
          GHCR_TOKEN_B64="$(printf '%s' "$GHCR_TOKEN" | base64 -w 0)"
          echo "=== Pulling images directly on the deploy host ==="
          ssh -i "$key_file" \\
            -p 22 \\
            -o BatchMode=yes \\
            -o ConnectTimeout=20 \\
            -o ConnectionAttempts=1 \\
            -o StrictHostKeyChecking=accept-new \\
            "$SSH_USER@$TAILSCALE_IP" \\
            'bash -s' <<REMOTE_SCRIPT
          set -Eeuo pipefail
          cleanup() { docker logout ghcr.io >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          printf '%s' '$GHCR_TOKEN_B64' | base64 -d | docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin
          docker pull ghcr.io/pgdias/kind-connect:latest
          docker pull postgres:16-alpine
          REMOTE_SCRIPT

      - name: Deploy via SSH (with diagnostics)
        shell: bash
        timeout-minutes: 5
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "=== Copying current deploy script to server ==="
          scp -i "$key_file" \
            -P 22 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=accept-new \
            scripts/deploy.sh \
            "$SSH_USER@$TAILSCALE_IP:/root/kind-connect/scripts/deploy.sh"
          echo "=== Starting SSH connection to deploy host ==="
          timeout --foreground 4m ssh \
            -i "$key_file" \
            -p 22 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$TAILSCALE_IP" \
            'bash /root/kind-connect/scripts/deploy.sh'
