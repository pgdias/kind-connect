name: CD Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Proxmox CT via Tailscale
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Diagnose Tailscale and SSH connectivity
        shell: bash
        run: |
          echo "=== Tailscale status ==="
          tailscale status
          echo "=== Tailscale ping ==="
          tailscale ping --timeout=10s 100.89.42.81 || true
          echo "=== TCP port 22 test ==="
          nc -vz -w 5 100.89.42.81 22

      - name: Transfer Docker images to deploy host
        shell: bash
        timeout-minutes: 8
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "=== Pulling application and PostgreSQL images on the GitHub runner ==="
          docker pull ghcr.io/pgdias/kind-connect:latest
          docker pull postgres:16-alpine

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          echo "=== Streaming images to the deploy host over Tailscale SSH ==="
          docker save ghcr.io/pgdias/kind-connect:latest postgres:16-alpine |
            gzip -1 |
            ssh -i "$key_file" \
              -p 22 \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=1 \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$TAILSCALE_IP" \
              'gunzip | docker load'

      - name: Deploy via SSH (with diagnostics)
        shell: bash
        timeout-minutes: 5
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "=== Starting SSH connection to deploy host ==="
          timeout --foreground 4m ssh \
            -i "$key_file" \
            -p 22 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$TAILSCALE_IP" \
            'bash /root/kind-connect/scripts/deploy.sh'
