name: CD Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Proxmox CT via Tailscale
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Diagnose Tailscale and SSH connectivity
        shell: bash
        run: |
          echo "=== Tailscale status ==="
          tailscale status
          echo "=== Tailscale ping ==="
          tailscale ping --timeout=10s 100.89.42.81 || true
          echo "=== TCP port 22 test ==="
          nc -vz -w 5 100.89.42.81 22

      - name: Deploy via SSH (with diagnostics)
        shell: bash
        timeout-minutes: 12
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "=== Starting SSH connection to deploy host ==="
          timeout --foreground 10m ssh -vv \
            -i "$key_file" \
            -p 22 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$TAILSCALE_IP" \
            'bash /root/kind-connect/scripts/deploy.sh'
