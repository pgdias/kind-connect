name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations-main
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply database migration directly
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing GitHub secret SUPABASE_DB_URL" && exit 1)
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify database state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select count(*) from public.analytics_campaign_funnel;"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select count(*) from public.analytics_maintenance where operation_key = 'initial_test_data_reset_2026_09_23';"
          psql "$SUPABASE_DB_URL" -Atc "select count(*) from pg_proc where pronamespace = 'public'::regnamespace and proname = 'reset_analytics_data';" | grep -qx "0"

